version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-abrams}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    ports:
      - "5440:5432"

  backend:
    build: ./backend
    env_file:
      - .env.prod
    command: gunicorn -b 0.0.0.0:8000 app.wsgi:app
    depends_on:
      - db
    ports:
      - "8200:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8100:80"

volumes:
  pgdata_prod:
